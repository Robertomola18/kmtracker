{% extends "base.html" %}
{% block title %}Registrar Mantenimiento{% endblock %}
{% block content %}
<h1>¿Que coche?</h1>
<p style="color:var(--text2);margin-bottom:1.5rem;">Selecciona el coche para registrar un mantenimiento:</p>

<div class="hub-grid">
    {% for c in cars %}
    <a href="/coche/{{ c.matricula | urlencode }}/mantenimiento/nuevo" class="hub-card">
        <div class="hub-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0abc8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
        <div class="hub-title">{{ c.modelo }}</div>
        <div class="hub-desc">{{ c.matricula }} · {{ "%.0f"|format(c.km_actual) }} km</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
