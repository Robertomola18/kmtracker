{% extends "base.html" %}
{% block title %}Registrar viaje{% endblock %}
{% block content %}
<h1>Registrar viaje</h1>
<form method="POST" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label>Coche
        <div class="form-static">{{ car.matricula }} · {{ car.modelo }}</div>
    </label>

    <label>Tipo
        <select name="tipo" required id="tipo-select">
            <option value="partial">Parcial</option>
            <option value="total">Total (odometro)</option>
            <option value="correction">Correccion</option>
        </select>
    </label>

    <label>Lectura
        <input type="text" inputmode="decimal" name="lectura" required placeholder="km">
    </label>

    <label class="checkbox-label" id="reset-field">
        <input type="checkbox" name="is_reset"> Reseteaste el parcial?
    </label>

    <label>Fecha
        <input type="date" name="fecha" value="{{ today }}" required>
    </label>

    <label>Nota
        <input type="text" name="nota" placeholder="opcional">
    </label>

    <button type="submit" class="btn">Registrar</button>
</form>

<script>
    document.getElementById('tipo-select').addEventListener('change', function() {
        var resetField = document.getElementById('reset-field');
        resetField.style.display = (this.value === 'partial') ? '' : 'none';
    });
    document.getElementById('tipo-select').dispatchEvent(new Event('change'));
</script>
{% endblock %}
