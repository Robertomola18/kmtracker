{% extends "base.html" %}
{% block title %}Subir Documento{% endblock %}
{% block content %}
<h1>¿Que coche?</h1>
<p style="color:var(--text2);margin-bottom:1.5rem;">Selecciona el coche para subir o ver documentos:</p>

<div class="hub-grid">
    {% for c in cars %}
    <a href="/coche/{{ c.matricula | urlencode }}/documentos" class="hub-card">
        <div class="hub-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0abc8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        <div class="hub-title">{{ c.modelo }}</div>
        <div class="hub-desc">{{ c.matricula }} · {{ "%.0f"|format(c.km_actual) }} km</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
