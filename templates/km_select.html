{% extends "base.html" %}
{% block title %}Registrar KM{% endblock %}
{% block content %}
<h1>¿Que coche?</h1>
<p style="color:var(--text2);margin-bottom:1.5rem;">Selecciona el coche para registrar kilometros:</p>

<div class="hub-grid">
    {% for c in cars %}
    <a href="/registrar/km/{{ c.matricula | urlencode }}" class="hub-card">
        <div class="hub-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0abc8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><path d="M3 11h18a1 1 0 0 1 1 1v3h-2.5"/><path d="M3 15H2v-3a1 1 0 0 1 1-1"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/></svg></div>
        <div class="hub-title">{{ c.modelo }}</div>
        <div class="hub-desc">{{ c.matricula }} · {{ "%.0f"|format(c.km_actual) }} km</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
